<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">질문과 자료에서 실무 결과물로 이어지는 AI 활용 흐름</title>
  <desc id="workflow-desc">업무 자료와 질문을 AI에 전달하고, 맥락과 목적에 맞게 검토하여 문서, 분석, 콘텐츠, 앱으로 발전시키는 과정을 보여 줍니다.</desc>
  <defs>
    <linearGradient id="workflow-panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1b4c"/><stop offset="1" stop-color="#0b1430"/></linearGradient>
    <linearGradient id="workflow-core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1fb6f6"/><stop offset="1" stop-color="#2f5be0"/></linearGradient>
    <linearGradient id="workflow-link" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3d7bf0" stop-opacity=".25"/><stop offset=".55" stop-color="#1fb6f6"/><stop offset="1" stop-color="#3d7bf0" stop-opacity=".5"/></linearGradient>
    <pattern id="workflow-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5b9bff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="640" height="500" rx="20" fill="url(#workflow-panel)"/>
  <rect x="1" y="1" width="638" height="498" rx="19" fill="url(#workflow-grid)" stroke="#5b9bff" stroke-opacity=".18"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <text x="36" y="43" fill="#5b9bff" font-size="12" letter-spacing="2.3">FROM QUESTION TO OUTPUT</text>
    <text x="36" y="83" fill="#fff" font-size="26" font-weight="650">AI를 일하는 방식으로.</text>
    <g fill="none" stroke="url(#workflow-link)" stroke-width="2">
      <path class="signal-line" d="M200 185H238Q250 185 250 197V248H267"/>
      <path class="signal-line" d="M200 315H238Q250 315 250 303V248"/>
      <path class="signal-line" d="M374 248H396Q412 248 412 232V162Q412 150 424 150H440"/>
      <path class="signal-line" d="M412 224H440M412 248V310Q412 322 424 322H440M412 310V384Q412 396 424 396H440"/>
    </g>
    <g fill="#0b1430" stroke="#5b9bff" stroke-opacity=".35">
      <rect x="36" y="153" width="164" height="64" rx="12"/>
      <rect x="36" y="283" width="164" height="64" rx="12"/>
      <rect x="440" y="122" width="164" height="56" rx="10"/>
      <rect x="440" y="196" width="164" height="56" rx="10"/>
      <rect x="440" y="294" width="164" height="56" rx="10"/>
      <rect x="440" y="368" width="164" height="56" rx="10"/>
    </g>
    <g fill="#fff" font-size="22" font-weight="550">
      <text x="61" y="193">업무 자료</text><text x="61" y="323">질문·목표</text>
      <text x="463" y="158">문서 작성</text><text x="463" y="232">자료 분석</text><text x="463" y="330">콘텐츠 제작</text><text x="463" y="404">앱 구현</text>
    </g>
    <g fill="none" stroke="#3d7bf0">
      <path d="M320 156L400 202V294L320 340L240 294V202Z" stroke-opacity=".2"/>
      <path d="M320 174L384 211V285L320 322L256 285V211Z" stroke-opacity=".35"/>
    </g>
    <g>
      <path d="M320 193L368 221L320 249L272 221Z" fill="#5b9bff"/>
      <path d="M272 221L320 249V305L272 277Z" fill="#2f5be0"/>
      <path d="M320 249L368 221V277L320 305Z" fill="url(#workflow-core)"/>
      <path d="M296 220L320 206L344 220L320 234Z" fill="#0f1b4c" fill-opacity=".85"/>
      <path d="M320 249V305" stroke="#1fb6f6" stroke-width="2"/>
      <text x="320" y="265" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">AI</text>
    </g>
    <g class="signal-node" fill="#1fb6f6"><circle cx="250" cy="248" r="4"/><circle cx="412" cy="224" r="4"/><circle cx="412" cy="322" r="4"/></g>
    <text x="320" y="369" text-anchor="middle" fill="#fff" font-size="20" font-weight="550">맥락과 목적에 맞게</text>
    <text x="320" y="396" text-anchor="middle" fill="#a8b4cf" font-size="18">검토하고 다듬기</text>
    <path d="M36 452H604" stroke="#5b9bff" stroke-opacity=".2"/>
    <text x="36" y="480" fill="#a8b4cf" font-size="15">도구 사용을 넘어, 내 업무에 적용하는 과정</text>
    <circle class="signal-node" cx="594" cy="40" r="4" fill="#1fb6f6"/>
  </g>
</svg>
